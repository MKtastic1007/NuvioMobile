name: iOS unsigned IPA

# Builds Nuvio for a real device WITHOUT code signing and packages it as an .ipa.
# Sideloadly re-signs it with your own Apple ID, so an unsigned IPA is exactly
# what you want here.
#
# Run it from the Actions tab -> "iOS unsigned IPA" -> Run workflow.
# Download the artifact when it finishes.

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "full (plugins + torrent engine) or appstore (stripped)"
        type: choice
        options: [full, appstore]
        default: full
      engine_version:
        description: "nuvio-engine release tag used for the 'full' build"
        default: "v0.1.1"
      kotlin_build_type:
        description: "Kotlin framework: debug links ~4x faster, release is optimized"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: macos-15-intel   # 14 GB RAM; the 7 GB arm64 runner OOMs the Kotlin/Native linker
    timeout-minutes: 300
    env:
      NUVIO_IOS_DISTRIBUTION: ${{ inputs.distribution }}
      # Decouples the Kotlin framework's build type from Xcode's -configuration, so the
      # Swift/app side stays Release while the Kotlin link can skip the optimizer.
      KOTLIN_FRAMEWORK_BUILD_TYPE: ${{ inputs.kotlin_build_type }}

    steps:
      - uses: actions/checkout@v4

      # The repo has orphan gitlinks (libass-android, vendor/*) with no .gitmodules
      # entries, so `submodules: recursive` aborts. iOS only needs MPVKit, which
      # iosApp links as a local Swift package.
      - name: Init MPVKit submodule
        run: git submodule update --init --depth 1 MPVKit && ls MPVKit

      - name: Cache Kotlin/Native + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kn-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: kn-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select newest installed Xcode
        run: |
          xc=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version

      # The runner has ~7 GB of RAM; the repo defaults ask for 12-16 GB heaps.
      - name: Size Gradle/Kotlin heaps to the runner
        run: |
          echo "RAM: $(( $(sysctl -n hw.memsize) / 1024 / 1024 )) MB, CPUs: $(sysctl -n hw.ncpu)"
          sed -i '' \
            -e 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx11264M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:G1PeriodicGCInterval=15000 -XX:MinHeapFreeRatio=5 -XX:MaxHeapFreeRatio=20/' \
            -e 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048M/' \
            -e 's/^kotlin.native.jvmArgs=.*/kotlin.native.jvmArgs=-Xmx11264M/' \
            gradle.properties
          cat gradle.properties

      # The app normally learns its backend from https://api.nuvio.tv/.well-known/nuvio
      # at runtime. Bake the same public discovery values in so the build is
      # pre-pointed at the official server instead of shipping a blank config.
      - name: Fetch official server discovery document
        run: |
          set -euo pipefail
          curl -fsSL https://api.nuvio.tv/.well-known/nuvio -o "$RUNNER_TEMP/discovery.json"
          backend=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/discovery.json"))["backend_url"])')
          key=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/discovery.json"))["publishable_key"])')
          {
            echo "NUVIO_SUPABASE_URL=$backend"
            echo "NUVIO_SUPABASE_ANON_KEY=$key"
          } >> local.properties
          echo "::add-mask::$key"
          echo "backend_url = $backend"

      # composeApp/build.gradle.kts expects ../nuvio-engine/platform/apple/NuvioEngine.xcframework
      # (a sibling of the checkout) for the "full" flavour. Use the prebuilt release.
      - name: Fetch Nuvio Engine xcframework
        if: inputs.distribution == 'full'
        run: |
          set -euo pipefail
          tag="${{ inputs.engine_version }}"
          ver="${tag#v}"
          mkdir -p "$RUNNER_TEMP/engine" ../nuvio-engine/platform/apple
          curl -fsSL -o "$RUNNER_TEMP/engine.zip" \
            "https://github.com/NuvioMedia/nuvio-engine/releases/download/${tag}/nuvio-engine-apple-${ver}.zip"
          unzip -q "$RUNNER_TEMP/engine.zip" -d "$RUNNER_TEMP/engine"
          cp -R "$RUNNER_TEMP/engine/nuvio-engine-apple-${ver}/NuvioEngine.xcframework" \
                ../nuvio-engine/platform/apple/
          ls ../nuvio-engine/platform/apple/NuvioEngine.xcframework

      # Link the Kotlin/Native framework on its own first: the K/N compiler runs
      # inside the Gradle daemon JVM, so it needs org.gradle.jvmargs to be large and
      # nothing else competing for the runner's 14 GB.
      - name: Pre-link Kotlin framework (arm64)
        run: |
          set -euo pipefail
          case "${{ inputs.kotlin_build_type }}" in
            debug)   task=':composeApp:linkDebugFrameworkIosArm64' ;;
            release) task=':composeApp:linkReleaseFrameworkIosArm64' ;;
            *) echo "unknown kotlin_build_type"; exit 1 ;;
          esac
          echo "Linking $task"
          time ./gradlew --max-workers=1 "$task"

      - name: Build (device, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -jobs 2 \
            -derivedDataPath build/ios-device \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package as .ipa
        run: |
          set -euo pipefail
          app=$(find build/ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $app"
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$app" payload/Payload/
          (cd payload && zip -qry "../Nuvio-${{ inputs.distribution }}-kt-${{ inputs.kotlin_build_type }}-unsigned.ipa" Payload)
          ls -lh Nuvio-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-${{ inputs.distribution }}-kt-${{ inputs.kotlin_build_type }}-unsigned-ipa
          path: Nuvio-*.ipa
          if-no-files-found: error
